<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Soundboard</title>
<style>
  :root { --bg: #111119; --surface: #181825; --text: #ccc; --border: #2a2a3a; --accent: #3a2a6e; --accent-hover: #4a3a80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem; user-select: none; }
  h1 { font-size: 1.2rem; margin-bottom: 0.5rem; opacity: 0.5; font-weight: 400; letter-spacing: 0.05em; }
  #toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; flex-wrap: wrap; }
  #toolbar button { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  #toolbar button:hover { background: #222233; }
  #toolbar button.active { background: var(--accent); border-color: #4a3a7e; }
  #status { font-size: 0.75rem; opacity: 0.4; }

  /* Device panel */
  #device-panel {
    width: min(95vw, 700px);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, margin 0.3s ease;
    margin-bottom: 0;
  }
  #device-panel.open {
    max-height: 60vh;
    margin-bottom: 1rem;
    overflow-y: auto;
  }
  #device-panel-inner {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  @media (min-width: 600px) {
    #device-panel-inner {
      flex-direction: row;
      gap: 0.5rem;
    }
  }
  .device-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    margin-top: 0.5rem;
    flex: 1;
    min-width: 0;
  }
  .device-section h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.5;
    margin-bottom: 0.4rem;
    font-weight: 500;
  }
  .device-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.35rem 0;
  }
  .device-row + .device-row {
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .device-name {
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-right: 0.5rem;
  }
  .device-row.disconnected .device-name {
    opacity: 0.35;
    text-decoration: line-through;
  }
  .device-empty {
    font-size: 0.75rem;
    opacity: 0.3;
    font-style: italic;
    padding: 0.2rem 0;
  }

  /* Toggle switch */
  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: #2a2a3a;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle .slider::before {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    left: 3px;
    top: 3px;
    background: #666;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider {
    background: var(--accent);
  }
  .toggle input:checked + .slider::before {
    transform: translateX(16px);
    background: #ccc;
  }

  #pad-grid { display: flex; flex-direction: column; gap: 8px; }
  .pad-row { display: flex; gap: 8px; justify-content: center; }

  .pad {
    width: 130px; height: 130px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.06s ease, box-shadow 0.06s ease;
    font-size: 0.85rem;
    touch-action: none;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .pad:hover { border-color: rgba(255,255,255,0.12); }
  .pad.active { transform: scale(0.94); }
  .pad .label { font-weight: 600; font-size: 0.95rem; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  .pad .info { font-size: 0.65rem; opacity: 0.5; margin-top: 3px; pointer-events: none; }

  @keyframes glow-jitter {
    0%   { box-shadow: 0 0 18px 4px var(--glow), inset 0 0 12px 2px var(--glow-inner); }
    25%  { box-shadow: 0 0 22px 6px var(--glow), inset 0 0 14px 3px var(--glow-inner); }
    50%  { box-shadow: 0 0 16px 3px var(--glow), inset 0 0 10px 1px var(--glow-inner); }
    75%  { box-shadow: 0 0 24px 5px var(--glow), inset 0 0 15px 2px var(--glow-inner); }
    100% { box-shadow: 0 0 18px 4px var(--glow), inset 0 0 12px 2px var(--glow-inner); }
  }
  .pad.playing {
    animation: glow-jitter 0.15s ease-in-out infinite;
    border-color: rgba(255,255,255,0.15);
  }
  .pad.toggled {
    border-color: rgba(255,255,255,0.2);
  }

  #event-log { margin-top: 1.2rem; width: min(95vw, 700px); max-height: 160px; overflow-y: auto; background: #0a0a12; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 0.7rem; padding: 0.5rem; opacity: 0.8; }
  #event-log .noteon { color: #3fb950; }
  #event-log .noteoff { color: #f85149; }
  #editor-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10; align-items: center; justify-content: center; }
  #editor-overlay.open { display: flex; }
  #editor { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; width: min(90vw, 700px); max-height: 85vh; display: flex; flex-direction: column; gap: 0.75rem; }
  #editor h2 { font-size: 1rem; font-weight: 500; }
  #editor textarea { width: 100%; height: 50vh; background: #0a0a12; color: #c9d1d9; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 0.8rem; padding: 0.75rem; resize: vertical; }
  #editor .buttons { display: flex; gap: 0.5rem; justify-content: flex-end; }
  #editor button { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 0.8rem; }
  #editor .save { background: #3a2a6e; color: white; border-color: #4a3a7e; }
  #editor .save:hover { background: #4a3a80; }
  #editor .cancel { background: var(--surface); color: var(--text); }
  #error { color: #ff6b6b; font-size: 0.8rem; min-height: 1.2em; }
</style>
</head>
<body>

<h1>MIDI Soundboard</h1>
<div id="toolbar">
  <button id="btn-devices">Devices</button>
  <button id="btn-edit">Edit Layout</button>
  <span id="status">Requesting MIDI access...</span>
</div>
<div id="device-panel"></div>
<div id="pad-grid"></div>
<div id="event-log"></div>

<div id="editor-overlay">
  <div id="editor">
    <h2>Edit Layout (JSON)</h2>
    <textarea id="json-editor" spellcheck="false"></textarea>
    <div id="error"></div>
    <div class="buttons">
      <button class="cancel" id="btn-cancel">Cancel</button>
      <button class="save" id="btn-save">Save</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "midi-soundboard-layout";
const STORAGE_ENABLED_OUTPUTS = "midi-soundboard-enabled-outputs";
const STORAGE_ENABLED_INPUTS = "midi-soundboard-enabled-inputs";
const MAX_LOG = 200;

const defaultLayout = [
  [
    { "channel": 1, "note": 36, "velocity": 127, "label": "Airhorn" },
    { "channel": 1, "note": 37, "velocity": 127, "label": "Kids Yeah" },
    { "channel": 1, "note": 38, "velocity": 127, "label": "Din" },
    { "channel": 1, "note": 39, "velocity": 127, "label": "Message" }
  ],
  [
    { "channel": 1, "note": 40, "velocity": 127, "label": "NS" },
    { "channel": 1, "note": 41, "velocity": 127, "label": "Offline" },
    { "channel": 1, "note": 42, "velocity": 127, "label": "Online" },
    { "channel": 1, "note": 43, "velocity": 127, "label": "Sad Trombone" }
  ],
  [
    { "channel": 1, "note": 44, "velocity": 127, "label": "Deep Note" },
    { "channel": 1, "note": 45, "velocity": 127, "label": "Foghorn" },
    { "channel": 1, "note": 46, "velocity": 127, "label": "Shutdown" },
    { "channel": 1, "note": 47, "velocity": 127, "label": "Win 3.1" }
  ],
  [
    { "channel": 1, "note": 48, "velocity": 127, "label": "Doorbell" },
    { "channel": 1, "note": 49, "velocity": 127, "label": "Groan" },
    { "channel": 1, "note": 50, "velocity": 127, "label": "Service Bell" }
  ]
];

let layout = loadLayout();
let midiAccess = null;

// Maps: port id → MIDIPort, for currently enabled devices
const enabledOutputs = new Map();
const enabledInputs = new Map();

function loadLayout() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch {}
  return defaultLayout;
}

function saveLayout(l) {
  layout = l;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(l));
}

// Saved preferences are stored by device name (IDs are ephemeral)
function loadSavedNames(key) {
  try {
    const stored = localStorage.getItem(key);
    if (stored) return new Set(JSON.parse(stored));
  } catch {}
  return null;
}

function savePref(key, map) {
  const names = [];
  for (const port of map.values()) names.push(port.name);
  localStorage.setItem(key, JSON.stringify(names));
}

// --- Event log ---

const logEl = document.getElementById("event-log");

function log(cls, text) {
  const line = document.createElement("div");
  line.className = cls;
  const ts = new Date().toLocaleTimeString("en", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit", fractionalSecondDigits: 3 });
  line.textContent = `${ts}  ${text}`;
  logEl.appendChild(line);
  while (logEl.children.length > MAX_LOG) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

// --- Status ---

function updateStatus() {
  const outCount = enabledOutputs.size;
  const inCount = enabledInputs.size;
  document.getElementById("status").textContent = `MIDI: ${outCount} out, ${inCount} in`;
}

// --- MIDI ---

async function initMidi() {
  const status = document.getElementById("status");
  try {
    midiAccess = await navigator.requestMIDIAccess();
    midiAccess.onstatechange = onStateChange;
    applyInitialDevices();
    log("", "MIDI access granted");
  } catch (e) {
    status.textContent = "MIDI unavailable: " + e.message;
    log("", "MIDI error: " + e.message);
  }
}

function applyInitialDevices() {
  const savedOutputNames = loadSavedNames(STORAGE_ENABLED_OUTPUTS);
  const savedInputNames = loadSavedNames(STORAGE_ENABLED_INPUTS);

  for (const [id, port] of midiAccess.outputs) {
    if (savedOutputNames && savedOutputNames.has(port.name)) {
      enabledOutputs.set(id, port);
    }
  }

  for (const [id, port] of midiAccess.inputs) {
    // First time (no saved prefs): enable all inputs (matches old behavior)
    if (savedInputNames === null || savedInputNames.has(port.name)) {
      enableInput(id, port);
    }
  }

  renderDevicePanel();
  updateStatus();
}

function onStateChange(e) {
  const port = e.port;
  if (port.state === "disconnected") {
    if (port.type === "output") enabledOutputs.delete(port.id);
    if (port.type === "input") {
      disableInput(port.id);
    }
  } else if (port.state === "connected") {
    // Auto-enable if name matches saved preference
    if (port.type === "output") {
      const savedNames = loadSavedNames(STORAGE_ENABLED_OUTPUTS);
      if (savedNames && savedNames.has(port.name)) {
        enabledOutputs.set(port.id, port);
      }
    }
    if (port.type === "input") {
      const savedNames = loadSavedNames(STORAGE_ENABLED_INPUTS);
      // null means first time → enable all
      if (savedNames === null || savedNames.has(port.name)) {
        enableInput(port.id, port);
      }
    }
  }
  renderDevicePanel();
  updateStatus();
  log("", `${port.type} ${port.state}: ${port.name}`);
}

// --- Input listening ---

function enableInput(id, port) {
  if (enabledInputs.has(id)) return;
  enabledInputs.set(id, port);
  port.onmidimessage = (e) => onFeedbackMessage(e, port.name);
}

function disableInput(id) {
  const port = enabledInputs.get(id);
  if (port) port.onmidimessage = null;
  enabledInputs.delete(id);
}

function onFeedbackMessage(e, portName) {
  const [status, note, vel] = e.data;
  const type = status & 0xF0;
  if (type === 0x90 && vel > 0) {
    const el = padsByNote.get(note);
    if (el) el.classList.add("playing");
    log("noteon", `RX Note On   note=${note} vel=${vel}  \u2190 ${portName}`);
  } else if (type === 0x80 || (type === 0x90 && vel === 0)) {
    const el = padsByNote.get(note);
    if (el) el.classList.remove("playing");
    log("noteoff", `RX Note Off  note=${note}  \u2190 ${portName}`);
  }
}

// --- Device panel ---

const devicePanel = document.getElementById("device-panel");
const btnDevices = document.getElementById("btn-devices");

btnDevices.addEventListener("click", () => {
  devicePanel.classList.toggle("open");
  btnDevices.classList.toggle("active");
});

function renderDevicePanel() {
  if (!midiAccess) return;
  devicePanel.innerHTML = "";
  const inner = document.createElement("div");
  inner.id = "device-panel-inner";

  // Outputs section
  const outSection = document.createElement("div");
  outSection.className = "device-section";
  outSection.innerHTML = "<h3>Outputs</h3>";
  let outCount = 0;
  for (const [id, port] of midiAccess.outputs) {
    outSection.appendChild(makeDeviceRow(id, port, "output"));
    outCount++;
  }
  if (outCount === 0) {
    const empty = document.createElement("div");
    empty.className = "device-empty";
    empty.textContent = "No output devices";
    outSection.appendChild(empty);
  }
  inner.appendChild(outSection);

  // Inputs section
  const inSection = document.createElement("div");
  inSection.className = "device-section";
  inSection.innerHTML = "<h3>Inputs</h3>";
  let inCount = 0;
  for (const [id, port] of midiAccess.inputs) {
    inSection.appendChild(makeDeviceRow(id, port, "input"));
    inCount++;
  }
  if (inCount === 0) {
    const empty = document.createElement("div");
    empty.className = "device-empty";
    empty.textContent = "No input devices";
    inSection.appendChild(empty);
  }
  inner.appendChild(inSection);
  devicePanel.appendChild(inner);
}

function makeDeviceRow(id, port, type) {
  const row = document.createElement("div");
  row.className = "device-row";
  if (port.state === "disconnected") row.classList.add("disconnected");

  const name = document.createElement("span");
  name.className = "device-name";
  name.textContent = port.name;
  row.appendChild(name);

  const toggle = document.createElement("label");
  toggle.className = "toggle";
  const input = document.createElement("input");
  input.type = "checkbox";
  const isEnabled = type === "output" ? enabledOutputs.has(id) : enabledInputs.has(id);
  input.checked = isEnabled;
  input.addEventListener("change", () => {
    if (type === "output") {
      if (input.checked) {
        enabledOutputs.set(id, port);
      } else {
        enabledOutputs.delete(id);
      }
      savePref(STORAGE_ENABLED_OUTPUTS, enabledOutputs);
      log("", `Output ${input.checked ? "enabled" : "disabled"}: ${port.name}`);
    } else {
      if (input.checked) {
        enableInput(id, port);
      } else {
        disableInput(id);
      }
      savePref(STORAGE_ENABLED_INPUTS, enabledInputs);
      log("", `Input ${input.checked ? "enabled" : "disabled"}: ${port.name}`);
    }
    updateStatus();
  });
  const slider = document.createElement("span");
  slider.className = "slider";
  toggle.appendChild(input);
  toggle.appendChild(slider);
  row.appendChild(toggle);

  return row;
}

// --- MIDI send (multi-output) ---

function sendNoteOn(channel, note, velocity) {
  if (enabledOutputs.size === 0) { log("", "No outputs enabled"); return; }
  const bytes = [0x90 | ((channel - 1) & 0xF), note & 0x7F, velocity & 0x7F];
  for (const [, port] of enabledOutputs) {
    port.send(bytes);
    log("noteon", `TX Note On   ch=${channel} note=${note} vel=${velocity}  \u2192 ${port.name}  [${bytes.map(b => b.toString(16).padStart(2,"0")).join(" ")}]`);
  }
}

function sendNoteOff(channel, note) {
  if (enabledOutputs.size === 0) return;
  const bytes = [0x80 | ((channel - 1) & 0xF), note & 0x7F, 0];
  for (const [, port] of enabledOutputs) {
    port.send(bytes);
    log("noteoff", `TX Note Off  ch=${channel} note=${note}  \u2192 ${port.name}  [${bytes.map(b => b.toString(16).padStart(2,"0")).join(" ")}]`);
  }
}

// --- Pad rendering ---

const padsByNote = new Map(); // note number -> DOM element

// Muted, dark-friendly palette
const colors = [
  { bg: "#2a1845", glow: "rgba(120,50,200,0.4)", glowInner: "rgba(120,50,200,0.15)" },
  { bg: "#3a1530", glow: "rgba(200,50,100,0.4)", glowInner: "rgba(200,50,100,0.15)" },
  { bg: "#152a3a", glow: "rgba(50,150,220,0.4)", glowInner: "rgba(50,150,220,0.15)" },
  { bg: "#2a2215", glow: "rgba(200,140,50,0.4)", glowInner: "rgba(200,140,50,0.15)" },
  { bg: "#153a20", glow: "rgba(50,200,90,0.4)",  glowInner: "rgba(50,200,90,0.15)" },
  { bg: "#2a153a", glow: "rgba(170,50,200,0.4)", glowInner: "rgba(170,50,200,0.15)" },
  { bg: "#2a2a15", glow: "rgba(200,200,50,0.35)",glowInner: "rgba(200,200,50,0.12)" },
  { bg: "#153035", glow: "rgba(50,200,200,0.4)", glowInner: "rgba(50,200,200,0.15)" },
  { bg: "#251535", glow: "rgba(140,60,180,0.4)", glowInner: "rgba(140,60,180,0.15)" },
  { bg: "#1a2a2a", glow: "rgba(80,180,160,0.4)", glowInner: "rgba(80,180,160,0.15)" },
  { bg: "#2a1a1a", glow: "rgba(180,80,80,0.4)",  glowInner: "rgba(180,80,80,0.15)" },
  { bg: "#1a1a2a", glow: "rgba(100,100,200,0.4)",glowInner: "rgba(100,100,200,0.15)" },
  { bg: "#2a2015", glow: "rgba(180,120,50,0.4)", glowInner: "rgba(180,120,50,0.15)" },
  { bg: "#1a2a1a", glow: "rgba(80,180,80,0.4)",  glowInner: "rgba(80,180,80,0.15)" },
  { bg: "#2a1a25", glow: "rgba(200,80,140,0.4)", glowInner: "rgba(200,80,140,0.15)" },
];

function renderPads() {
  const grid = document.getElementById("pad-grid");
  grid.innerHTML = "";
  padsByNote.clear();
  let colorIdx = 0;
  for (const row of layout) {
    const rowEl = document.createElement("div");
    rowEl.className = "pad-row";
    for (const pad of row) {
      const c = colors[colorIdx % colors.length];
      const el = document.createElement("div");
      el.className = "pad";
      el.style.background = c.bg;
      el.style.setProperty("--glow", c.glow);
      el.style.setProperty("--glow-inner", c.glowInner);
      el.innerHTML = `<span class="label">${esc(pad.label)}</span><span class="info">ch${pad.channel} n${pad.note}</span>`;

      // Left click: note on while held, note off on release
      el.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        el.classList.add("active");
        sendNoteOn(pad.channel, pad.note, pad.velocity);
      });
      el.addEventListener("pointerup", (e) => {
        if (e.button !== 0) return;
        el.releasePointerCapture(e.pointerId);
        el.classList.remove("active");
        sendNoteOff(pad.channel, pad.note);
      });
      el.addEventListener("pointercancel", (e) => {
        el.releasePointerCapture(e.pointerId);
        el.classList.remove("active");
        sendNoteOff(pad.channel, pad.note);
      });
      // Right click: toggle -- send note on if off, note off if on
      el.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (el.classList.contains("toggled")) {
          el.classList.remove("toggled");
          sendNoteOff(pad.channel, pad.note);
        } else {
          el.classList.add("toggled");
          sendNoteOn(pad.channel, pad.note, pad.velocity);
        }
      });

      padsByNote.set(pad.note, el);
      rowEl.appendChild(el);
      colorIdx++;
    }
    grid.appendChild(rowEl);
  }
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// --- Editor ---

document.getElementById("btn-edit").addEventListener("click", () => {
  document.getElementById("json-editor").value = JSON.stringify(layout, null, 2);
  document.getElementById("error").textContent = "";
  document.getElementById("editor-overlay").classList.add("open");
});

document.getElementById("btn-cancel").addEventListener("click", () => {
  document.getElementById("editor-overlay").classList.remove("open");
});

document.getElementById("btn-save").addEventListener("click", () => {
  const errEl = document.getElementById("error");
  try {
    const parsed = JSON.parse(document.getElementById("json-editor").value);
    if (!Array.isArray(parsed)) throw new Error("Root must be an array of rows");
    for (let i = 0; i < parsed.length; i++) {
      if (!Array.isArray(parsed[i])) throw new Error(`Row ${i} must be an array`);
      for (let j = 0; j < parsed[i].length; j++) {
        const p = parsed[i][j];
        if (typeof p.channel !== "number") throw new Error(`Row ${i} pad ${j}: channel must be a number`);
        if (typeof p.note !== "number") throw new Error(`Row ${i} pad ${j}: note must be a number`);
        if (typeof p.velocity !== "number") throw new Error(`Row ${i} pad ${j}: velocity must be a number`);
        if (typeof p.label !== "string") throw new Error(`Row ${i} pad ${j}: label must be a string`);
      }
    }
    saveLayout(parsed);
    renderPads();
    document.getElementById("editor-overlay").classList.remove("open");
  } catch (e) {
    errEl.textContent = e.message;
  }
});

// --- Init ---
renderPads();
initMidi();
</script>
</body>
</html>
